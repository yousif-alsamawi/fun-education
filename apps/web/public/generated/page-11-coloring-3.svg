
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
    <rect width="600" height="800" fill="#ffffff" />
    <rect x="25" y="25" width="550" height="750" fill="none" stroke="#0f172a" stroke-width="6" rx="16" />

    <text x="300" y="80" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#0f172a">
      درع وشارة البطل يوسف!
    </text>
    <line x1="120" y1="100" x2="480" y2="100" stroke="#0f172a" stroke-width="3" stroke-dasharray="8 8" />

    <!-- درع ضخم مفرغ للتلوين -->
    <g stroke="#0f172a" stroke-width="6" fill="none" stroke-linejoin="round">
      <!-- الإطار الخارجي للدرع -->
      <path d="M150,180 L450,180 Q450,380 300,520 Q150,380 150,180 Z" />
      <!-- الإطار الداخلي -->
      <path d="M180,210 L420,210 Q420,360 300,470 Q180,360 180,210 Z" stroke-width="4" stroke-dasharray="6 6" />

      <!-- نجمة مركزية ضخمة -->
      <polygon points="300,250 315,295 360,295 325,325 338,370 300,340 262,370 275,325 240,295 285,295" stroke-width="5" />

      <!-- أجنحة البطولة الجانبية -->
      <path d="M150,220 Q70,250 90,340 Q130,340 150,300" stroke-width="5" />
      <path d="M450,220 Q530,250 510,340 Q470,340 450,300" stroke-width="5" />
    </g>

    <!-- شريط الاسم المفرغ أسفل الدرع -->
    <g transform="translate(300, 600)">
      <path d="M-180,-30 L180,-30 L160,30 L-160,30 Z" fill="none" stroke="#0f172a" stroke-width="5" />
      <text x="0" y="10" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="none" stroke="#0f172a" stroke-width="2">
        بطل الأخلاق: يوسف
      </text>
    </g>
  </svg>
  